[package]
name = "llm-tracker"
version = "0.1.0"
edition = "2021"
description = "Claude, OpenAI(Codex), OpenCode Go 남은 사용량을 보여주는 초경량 Windows 트레이 앱"
license = "MIT"
repository = "https://github.com/demolabskr/my-llm-tracker"
readme = "README.md"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security_Cryptography",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
